name: Python smoke
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install "jsonschema==4.23.0" "referencing==0.35.1"
      - name: Install project (editable)
        # Installs sih26168_contracts (and sih26168_bootstrap) as real,
        # importable packages per pyproject.toml's package-dir mapping, so
        # test_placed_python_package_is_importable_and_roundtrips exercises
        # genuine installability rather than a hand-loaded module spec.
        run: pip install -e .
      - name: Verify
        run: python -m unittest discover -s tools/bootstrap/tests
