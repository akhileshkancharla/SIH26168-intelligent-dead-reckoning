name: Repository policy
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runner-preflight:
    runs-on: [self-hosted, Windows, X64, sih26168]
    env:
      PSExecutionPolicyPreference: Bypass
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Reject untrusted fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Write-Error 'Fork-origin pull requests cannot execute code on the self-hosted runner. Reproduce the change on a trusted repository branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run runner preflight
        run: ./ci/self_hosted_runner_preflight.ps1
  repository-policy-check:
    runs-on: [self-hosted, Windows, X64, sih26168]
    env:
      PSExecutionPolicyPreference: Bypass
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Reject untrusted fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Write-Error 'Fork-origin pull requests cannot execute code on the self-hosted runner. Reproduce the change on a trusted repository branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify machine Python 3.12
        run: |
          $pythonVersion = (& python --version 2>&1).Trim()
          Write-Host "Machine Python: $pythonVersion"
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -notmatch '^Python 3\.12\.\d+$') {
            Write-Error "Machine Python 3.12.x is required."
            exit 1
          }
      - name: Verify
        run: python ci/verify_repository.py policy
