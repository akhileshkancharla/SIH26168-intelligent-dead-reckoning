name: Repository policy
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runner-preflight:
    runs-on: [self-hosted, Windows, X64, sih26168]
    steps:
      - name: Reject untrusted fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          Write-Error 'Fork-origin pull requests cannot execute code on the self-hosted runner. Reproduce the change on a trusted repository branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '8.10.2'
      - name: Run runner preflight
        shell: powershell
        run: ./ci/self_hosted_runner_preflight.ps1
  repository-policy-check:
    runs-on: [self-hosted, Windows, X64, sih26168]
    steps:
      - name: Reject untrusted fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          Write-Error 'Fork-origin pull requests cannot execute code on the self-hosted runner. Reproduce the change on a trusted repository branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify
        run: python ci/verify_repository.py policy
