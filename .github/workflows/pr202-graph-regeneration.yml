name: One-shot PR 202 Graphify regeneration

on:
  push:
    branches:
      - issue/WP-12.3-wp-12-3-integrate-onnx
    paths:
      - .github/workflows/pr202-graph-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: issue/WP-12.3-wp-12-3-integrate-onnx

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned Graphify
        run: python -m pip install graphifyy==0.9.53

      - name: Regenerate twice from exact clean source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD^)"
          source_dir="${RUNNER_TEMP}/pr202-source"
          first_dir="${RUNNER_TEMP}/pr202-first"
          git worktree add --detach "${source_dir}" "${source_sha}"
          mkdir -p "${first_dir}"

          regenerate() {
            cd "${source_dir}"
            rm -rf graphify-out
            graphify extract . --code-only
            graphify cluster-only . --no-label
            python tools/graphify/sanitize_graph.py \
              --graphify-version 0.9.53 \
              --source-branch issue/WP-12.3-wp-12-3-integrate-onnx \
              --source-parent-commit "${source_sha}" \
              --source-state clean
            python tools/graphify/verify_graph.py
          }

          regenerate
          cp docs/architecture/dependency-graph/graph.json "${first_dir}/graph.json"
          cp docs/architecture/dependency-graph/GRAPH_REPORT.md "${first_dir}/GRAPH_REPORT.md"
          cp docs/architecture/dependency-graph/metadata.json "${first_dir}/metadata.json"
          cp docs/architecture/dependency-graph/SHA256SUMS.txt "${first_dir}/SHA256SUMS.txt"

          regenerate
          cmp "${first_dir}/graph.json" docs/architecture/dependency-graph/graph.json
          cmp "${first_dir}/GRAPH_REPORT.md" docs/architecture/dependency-graph/GRAPH_REPORT.md
          cmp "${first_dir}/metadata.json" docs/architecture/dependency-graph/metadata.json
          cmp "${first_dir}/SHA256SUMS.txt" docs/architecture/dependency-graph/SHA256SUMS.txt

          cp docs/architecture/dependency-graph/graph.json "${GITHUB_WORKSPACE}/docs/architecture/dependency-graph/graph.json"
          cp docs/architecture/dependency-graph/GRAPH_REPORT.md "${GITHUB_WORKSPACE}/docs/architecture/dependency-graph/GRAPH_REPORT.md"
          cp docs/architecture/dependency-graph/metadata.json "${GITHUB_WORKSPACE}/docs/architecture/dependency-graph/metadata.json"
          cp docs/architecture/dependency-graph/SHA256SUMS.txt "${GITHUB_WORKSPACE}/docs/architecture/dependency-graph/SHA256SUMS.txt"

      - name: Refresh manifest and publish governed artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr202-graph-regeneration.yml
          python ci/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/architecture/dependency-graph/graph.json \
            docs/architecture/dependency-graph/GRAPH_REPORT.md \
            docs/architecture/dependency-graph/metadata.json \
            docs/architecture/dependency-graph/SHA256SUMS.txt \
            docs/bootstrap/repository_manifest.json \
            .github/workflows/pr202-graph-regeneration.yml
          git diff --cached --check
          git commit -m "docs(graph): regenerate WP-12.3 sanitized snapshot"
          git push origin HEAD:issue/WP-12.3-wp-12-3-integrate-onnx
