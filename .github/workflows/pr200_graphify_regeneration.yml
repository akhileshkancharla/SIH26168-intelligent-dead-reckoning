name: PR 200 one-shot Graphify regeneration

on:
  push:
    branches:
      - issue/WP-12.1-wp-12-1-export-candidate
    paths:
      - .github/workflows/pr200_graphify_regeneration.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue/WP-12.1-wp-12-1-export-candidate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove this one-shot workflow before extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr200_graphify_regeneration.yml
          git commit -m "chore(ci): remove one-shot graph regeneration workflow"
          git push origin HEAD:issue/WP-12.1-wp-12-1-export-candidate
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install exact Graphify version
        run: python -m pip install --disable-pip-version-check graphifyy==0.9.53

      - name: Regenerate twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/graphify/update_graph.sh
          tools/graphify/update_graph.sh
          first="$(mktemp -d)"
          cp docs/architecture/dependency-graph/graph.json "$first/graph.json"
          cp docs/architecture/dependency-graph/GRAPH_REPORT.md "$first/GRAPH_REPORT.md"
          cp docs/architecture/dependency-graph/metadata.json "$first/metadata.json"
          cp docs/architecture/dependency-graph/SHA256SUMS.txt "$first/SHA256SUMS.txt"
          tools/graphify/update_graph.sh
          cmp "$first/graph.json" docs/architecture/dependency-graph/graph.json
          cmp "$first/GRAPH_REPORT.md" docs/architecture/dependency-graph/GRAPH_REPORT.md
          cmp "$first/metadata.json" docs/architecture/dependency-graph/metadata.json
          cmp "$first/SHA256SUMS.txt" docs/architecture/dependency-graph/SHA256SUMS.txt

      - name: Refresh manifest and verify requested checks
        shell: bash
        run: |
          set -euo pipefail
          python ci/update_manifest.py
          python tools/graphify/verify_graph.py
          python ci/verify_repository.py all
          python ci/verify_repository.py forbidden
          python -m unittest discover -s tools/graphify/tests -v
          python -m unittest discover -s experiments/wp12_1/tests -v
          git diff --check

      - name: Commit only governed artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add             docs/architecture/dependency-graph/graph.json             docs/architecture/dependency-graph/GRAPH_REPORT.md             docs/architecture/dependency-graph/metadata.json             docs/architecture/dependency-graph/SHA256SUMS.txt             docs/bootstrap/repository_manifest.json
          git diff --cached --name-only > /tmp/actual-paths.txt
          printf '%s\n'             docs/architecture/dependency-graph/GRAPH_REPORT.md             docs/architecture/dependency-graph/SHA256SUMS.txt             docs/architecture/dependency-graph/graph.json             docs/architecture/dependency-graph/metadata.json             docs/bootstrap/repository_manifest.json > /tmp/expected-paths.txt
          sort -o /tmp/actual-paths.txt /tmp/actual-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git commit -m "docs(graph): regenerate sanitized dependency snapshot"
          git push origin HEAD:issue/WP-12.1-wp-12-1-export-candidate
