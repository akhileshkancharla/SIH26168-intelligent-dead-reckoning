name: Graphify snapshot validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graphify-snapshot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run deterministic Graphify workflow tests
        run: python -m unittest discover -s tools/graphify/tests -v
      - name: Verify committed sanitized snapshot
        run: python tools/graphify/verify_graph.py
      - name: Run integrated repository policy
        run: python ci/verify_repository.py all
