name: Author-aware review policy
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sensitive-review-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {...context.repo, pull_number: pr.number, per_page: 100});
            const latest = new Map(); for (const r of reviews) latest.set(r.user.login.toLowerCase(), r);
            const author = pr.user.login.toLowerCase();
            const lead = 'akhileshkancharla';
            const ciOwner = 'faisaltabrez';
            const requiredApprovers = author === lead ? [ciOwner] : author === ciOwner ? [lead] : [lead, ciOwner];
            const approvals = new Set([...latest.values()]
              .filter(r => r.state === 'APPROVED' && r.commit_id === pr.head.sha && r.user.login.toLowerCase() !== author)
              .map(r => r.user.login.toLowerCase()));
            const missing = requiredApprovers.filter(login => !approvals.has(login));
            if (missing.length) core.setFailed(`Approval policy for @${pr.user.login} requires current-head approval from: ${missing.map(login => `@${login}`).join(', ')}.`);
