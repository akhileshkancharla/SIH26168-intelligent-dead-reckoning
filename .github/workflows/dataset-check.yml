name: WP-10 dataset tooling
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dataset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install "jsonschema==4.23.0" "referencing==0.35.1"
      - name: Run WP-10 dataset tooling tests
        run: python -m unittest discover -s tools/dataset/tests -v
      - name: Run forbidden-file policy scan
        run: python ci/verify_repository.py forbidden
