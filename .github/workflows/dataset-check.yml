name: WP-10 dataset tooling
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dataset-check:
    runs-on: [self-hosted, Windows, X64, sih26168]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Reject untrusted fork code
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: cmd
        run: |
          echo Fork-origin pull requests cannot execute code on the self-hosted runner. Reproduce the change on a trusted repository branch. 1>&2
          exit /b 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify machine Python 3.12
        run: |
          python --version
          python -c "import sys; print('Machine Python:', sys.version.split()[0]); raise SystemExit(sys.version_info[:2] != (3, 12))"
      - name: Create clean virtual environment
        run: |
          if exist .ci-venv rmdir /s /q .ci-venv
          python -m venv .ci-venv
      - name: Install dependencies
        run: .\.ci-venv\Scripts\python.exe -m pip install "jsonschema==4.23.0" "referencing==0.35.1"
      - name: Install project (editable)
        run: .\.ci-venv\Scripts\python.exe -m pip install -e .
      - name: Run WP-10 dataset tooling tests
        run: .\.ci-venv\Scripts\python.exe -m unittest discover -s tools/dataset/tests -v
      - name: Run forbidden-file policy scan
        run: .\.ci-venv\Scripts\python.exe ci/verify_repository.py forbidden
