[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26168-bootstrap"
version = "0.1.0"
requires-python = ">=3.11"
description = "Repository-verification scaffold; not a navigation implementation"
dependencies = [
    "jsonschema==4.23.0",
    "referencing==0.35.1",
]

[tool.setuptools]
packages = ["sih26168_bootstrap", "sih26168_contracts"]

[tool.setuptools.package-dir]
sih26168_bootstrap = "tools/bootstrap/src/sih26168_bootstrap"
sih26168_contracts = "tools/contracts/sih26168_contracts"
